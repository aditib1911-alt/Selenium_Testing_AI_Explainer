name: UI+API Regression

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  regression:
    # Linux runner: Safari cannot run here (no Safari/WebKit on Linux), so the
    # Safari leg of the browser matrix is intentionally excluded via testng-ci.xml.
    # It only runs locally on macOS via testng-full.xml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start Selenium Grid
        run: docker compose up -d --wait

      - name: Run suite (Chrome/Firefox/Edge + API)
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn test -DsuiteFile=testsuites/testng-ci.xml

      - name: Generate Allure report
        if: always()
        run: mvn io.qameta.allure:allure-maven:report

      # Read-only: analyzes any failed test (UI or API) and writes a root-cause +
      # recommended-fix report. Never patches source, never opens a branch/PR.
      - name: AI failure explainer
        if: always() && github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          mvn exec:java
          -Dexec.mainClass=com.qa.framework.aiagent.explainer.FailureExplainerRunner
          -Dexec.classpathScope=test

      - name: Post failure explanations as a PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=target/aiagent/failure-explanations.md
          if [ -s "$REPORT" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$REPORT"
          else
            echo "No failures to explain -- skipping PR comment."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down
